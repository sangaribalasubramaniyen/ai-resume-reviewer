<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AI Resume Reviewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Toast element (sits invisible until showToast() is called) -->
  <div id="toast" class="toast"></div>

  <div class="auth-wrap">
    <h1 style="text-align:center; color:var(--blue); font-size:22px; margin-bottom:20px;">
      📄 AI Resume Reviewer
    </h1>

    <div class="card">
      <h3>Login</h3>

      <input type="email" id="email" placeholder="Email" />

      <div style="position:relative;">
        <input type="password" id="password" placeholder="Password" style="padding-right:42px;" />
        <span id="togglePass" onclick="togglePassword()"
        style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6b7280;
        display:flex;"></span>
      </div>

      <button onclick="login()" style="width:100%; margin-top:6px;">Login</button>
      <div id="authStatus" style="margin-top:12px; font-size:14px; color:var(--muted);"></div>

      <p style="margin-top:16px; text-align:center; font-size:14px;">
        New here? <a href="signup.html">Create an account</a>
      </p>
    </div>
  </div>

  <script>
    const API = "https://ai-resume-reviewer-qisc.onrender.com";

    // --- Reusable toast: showToast("message", "success" | "error" | "info") ---
    function showToast(message, type = "info", duration = 2500) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "toast " + type;   // reset + apply color type
      void toast.offsetWidth;              // force reflow so the animation restarts
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), duration);
    }

    if (localStorage.getItem("token")) {
      window.location.href = "dashboard.html";
    }

    // Show a one-time "flash" message (e.g. after logout) as a toast, then clear it
    const flash = localStorage.getItem("flash");
    if (flash) {
      showToast(flash, "success");
      localStorage.removeItem("flash");
    }

    const passInput  = document.getElementById("password");
    const togglePass = document.getElementById("togglePass");

    const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const eyeOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    togglePass.innerHTML = eyeIcon;

    function togglePassword() {
      if (passInput.type === "password") {
        passInput.type = "text";
        togglePass.innerHTML = eyeOffIcon;
      } else {
        passInput.type = "password";
        togglePass.innerHTML = eyeIcon;
      }
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = passInput.value;
      const authStatus = document.getElementById("authStatus");

      const form = new URLSearchParams();
      form.append("username", email);
      form.append("password", password);

      try {
        const res = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form,
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem("token", data.access_token);
          showToast("✅ Login successful!", "success");
          setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
        } else {
          showToast("❌ Invalid email or password", "error");
        }
      } catch (e) {
        showToast("❌ Could not reach the server. Is it running?", "error");
      }
    }
  </script>
</body>
</html>
