<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password - AI Resume Reviewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="auth-split">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <div class="auth-logo">📄 AI Resume Reviewer</div>
        <h2 class="auth-tagline">Choose a new password</h2>
        <p class="auth-sub">Pick something strong — at least 6 characters.</p>
      </div>
    </aside>

    <main class="auth-form-side">
      <div class="auth-form-box">
        <h3 class="auth-form-title">Set a new password</h3>
        <p class="auth-form-subtitle">Enter and confirm your new password</p>

        <div id="formArea">
          <label for="password" class="field-label">New password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" placeholder="At least 6 characters" />
            <span id="togglePass" class="input-toggle">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>

          <label for="confirm" class="field-label">Confirm password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="confirm" placeholder="Re-enter your password" />
          </div>

          <button id="resetBtn" onclick="resetPassword()" class="btn-block">Update password</button>
        </div>
        <div id="authStatus" class="auth-status"></div>

        <p class="auth-switch"><a href="login.html">&larr; Back to login</a></p>
      </div>
    </main>
  </div>

  <script>
    const API = "https://ai-resume-reviewer-qisc.onrender.com";

    function showToast(message, type = "info", duration = 3000) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "toast " + type;
      void toast.offsetWidth;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), duration);
    }

    const token = new URLSearchParams(window.location.search).get("token");
    const passInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm");
    const status = document.getElementById("authStatus");

    if (!token) {
      document.getElementById("formArea").style.display = "none";
      status.innerHTML = '❌ This reset link is missing its token. <a href="forgot.html">Request a new link</a>.';
      status.style.color = "#dc2626";
    }

    document.getElementById("togglePass").addEventListener("click", () => {
      const show = passInput.type === "password";
      passInput.type = show ? "text" : "password";
      confirmInput.type = show ? "text" : "password";
    });
    confirmInput.addEventListener("keydown", e => { if (e.key === "Enter") resetPassword(); });

    async function resetPassword() {
      const btn = document.getElementById("resetBtn");
      const pw = passInput.value;

      if (pw.length < 6) { showToast("❌ Password must be at least 6 characters", "error"); return; }
      if (pw !== confirmInput.value) { showToast("❌ Passwords don't match", "error"); return; }

      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Updating...';

      try {
        const res = await fetch(`${API}/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pw }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          localStorage.setItem("flash", "✅ Password updated. Please log in.");
          window.location.href = "login.html";
          return;
        }
        showToast("❌ " + (data.detail || "Something went wrong"), "error");
      } catch (e) {
        showToast("❌ Could not reach the server. Try again.", "error");
      }
      btn.disabled = false;
      btn.innerHTML = original;
    }
  </script>
</body>
</html>
