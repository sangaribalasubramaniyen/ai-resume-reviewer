<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password - AI Resume Reviewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="auth-split">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <div class="auth-logo">📄 AI Resume Reviewer</div>
        <h2 class="auth-tagline">Forgot your password?</h2>
        <p class="auth-sub">No problem — we'll email you a secure link to set a new one.</p>
      </div>
    </aside>

    <main class="auth-form-side">
      <div class="auth-form-box">
        <h3 class="auth-form-title">Reset your password</h3>
        <p class="auth-form-subtitle">Enter your account email and we'll send you a reset link</p>

        <div id="formArea">
          <label for="email" class="field-label">Email</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="email" placeholder="you@example.com" />
          </div>
          <button id="sendBtn" onclick="sendLink()" class="btn-block">Send reset link</button>
        </div>
        <div id="authStatus" class="auth-status"></div>

        <p class="auth-switch"><a href="login.html">&larr; Back to login</a></p>
      </div>
    </main>
  </div>

  <script>
    const API = "https://ai-resume-reviewer-qisc.onrender.com";

    function showToast(message, type = "info", duration = 3000) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = "toast " + type;
      void toast.offsetWidth;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), duration);
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") sendLink(); });

    async function sendLink() {
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("sendBtn");
      const status = document.getElementById("authStatus");

      if (!emailPattern.test(email)) {
        showToast("❌ Enter a valid email address", "error");
        return;
      }

      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Sending...';

      try {
        const res = await fetch(`${API}/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) throw new Error();
        document.getElementById("formArea").style.display = "none";
        status.innerHTML = "✅ If <strong></strong> is registered, a reset link is on its way. The link expires in 30 minutes.";
        status.querySelector("strong").textContent = email;
        status.style.color = "#16a34a";
      } catch (e) {
        showToast("❌ Could not reach the server. Try again.", "error");
        btn.disabled = false;
        btn.innerHTML = original;
      }
    }
  </script>
</body>
</html>
