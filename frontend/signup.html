<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign up - AI Resume Reviewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>📄 AI Resume Reviewer</h1>

    <div class="card">
      <h3>Create an account</h3>
      <input type="email" id="email" placeholder="example@gmail.com" />
      <div class="error" id="emailError"></div>

      <div style="position:relative;">
        <input type="password" id="password" placeholder="Password" style="padding-right:42px;" />
        <span id="togglePass" onclick="togglePassword()"
              style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6b7280;
  display:flex;"></span>
      </div>
      <div class="error" id="passError"></div>

      <button id="signupBtn" onclick="signup()" class="btn-green" disabled>Sign up</button>
      <div id="authStatus"></div>
      <p style="margin-top:14px;">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
      const API = "http://127.0.0.1:8000";

      // --- Grab elements ONCE, at the top (so every function can use them) ---
      const emailEl   = document.getElementById("emailError");
      const passEl    = document.getElementById("passError");
      const signupBtn = document.getElementById("signupBtn");
      const togglePass = document.getElementById("togglePass");
      const authStatus = document.getElementById("authStatus");

      // --- Eye icons (top-level, so they're visible everywhere) ---
      const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11
  8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;

      const eyeOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12
  20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3
  0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

      togglePass.innerHTML = eyeIcon;   // show the eye when the page loads

      function togglePassword() {
        if (passEl.type === "password") {
          passEl.type = "text";
          togglePass.innerHTML = eyeOffIcon;
        } else {
          passEl.type = "password";
          togglePass.innerHTML = eyeIcon;
        }
      }

      // --- Enable button only when BOTH fields are filled ---
    function validate() {
      const email = emailEl.value.trim();
      const password = passEl.value;
      let emailOk = false, passOk = false;

    // --- Email rule: must look like name@domain.tld ---
     const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
     if (email === "") {
       emailError.textContent = "";                       // empty: no error yet
     } else if (!emailPattern.test(email)) {
        emailError.textContent = "Enter a valid email address";
    } else {
      emailError.textContent = "";
      emailOk = true;
    }

    // --- Password rule: at least 6 characters ---
    if (password === "") {
      passError.textContent = "";
    } else if (password.length < 6) {
      passError.textContent = "Password must be at least 6 characters";
    } else {
      passError.textContent = "";
      passOk = true;
    }

    // Enable the button ONLY when both are valid
    signupBtn.disabled = !(emailOk && passOk);
  }

  emailEl.addEventListener("input", validate);
  passEl.addEventListener("input", validate);

      // --- Sign up ---
      async function signup() {
        const email = emailEl.value.trim();
        const password = passEl.value;

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
          authStatus.textContent = "❌ Please enter a valid email address.";
          return;
        }

        const res = await fetch(`${API}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (res.ok) {
          authStatus.textContent = "✅ Account created! Redirecting to login...";
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } else {
          const err = await res.json();
          authStatus.textContent = "❌ " + (err.detail || "Signup failed");
        }
      }
    </script>
  </body>
  </html>
