<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - AI Resume Reviewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-wrap">
    <h1 style="text-align:center; color:var(--blue); font-size:22px; margin-bottom:20px;">
      📄 AI Resume Reviewer
    </h1>

    <div class="card">
      <h3>Create an account</h3>

      <input type="email" id="email" placeholder="example@gmail.com" />
      <div class="error" id="emailError"></div>

      <div style="position:relative;">
        <input type="password" id="password" placeholder="Password" style="padding-right:42px;" />
         <span id="togglePass" onclick="togglePassword()"
        style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6b7280;
        display:flex;"></span>
      </div>
      <div class="error" id="passError"></div>

      <button id="signupBtn" onclick="signup()" class="btn-green" disabled style="width:100%;">Sign up</button>
      <div id="authStatus" style="margin-top:12px; font-size:14px; color:var(--muted);"></div>

      <p style="margin-top:16px; text-align:center; font-size:14px;">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    // --- Grab elements ONCE. INPUTS and ERROR DIVS are different elements! ---
    const emailInput = document.getElementById("email");      // the email INPUT box
    const passInput  = document.getElementById("password");   // the password INPUT box
    const emailError = document.getElementById("emailError"); // the error message DIV
    const passError  = document.getElementById("passError");  // the error message DIV
    const signupBtn  = document.getElementById("signupBtn");
    const togglePass = document.getElementById("togglePass");
    const authStatus = document.getElementById("authStatus");

    // --- Eye icons ---
    const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const eyeOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    togglePass.innerHTML = eyeIcon;

    function togglePassword() {
      if (passInput.type === "password") {
        passInput.type = "text";
        togglePass.innerHTML = eyeOffIcon;
      } else {
        passInput.type = "password";
        togglePass.innerHTML = eyeIcon;
      }
    }

    // --- Enable button only when BOTH fields are valid ---
    function validate() {
      const email = emailInput.value.trim();
      const password = passInput.value;
      let emailOk = false, passOk = false;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        emailError.textContent = "";
      } else if (!emailPattern.test(email)) {
        emailError.textContent = "Enter a valid email address";
      } else {
        emailError.textContent = "";
        emailOk = true;
      }

      if (password === "") {
        passError.textContent = "";
      } else if (password.length < 6) {
        passError.textContent = "Password must be at least 6 characters";
      } else {
        passError.textContent = "";
        passOk = true;
      }

      signupBtn.disabled = !(emailOk && passOk);
    }

    emailInput.addEventListener("input", validate);
    passInput.addEventListener("input", validate);

    // --- Sign up ---
    async function signup() {
      const email = emailInput.value.trim();
      const password = passInput.value;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        authStatus.textContent = "❌ Please enter a valid email address.";
        return;
      }

      try {
        const res = await fetch(`${API}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (res.ok) {
          authStatus.textContent = "✅ Account created! Redirecting to login...";
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } else {
          const err = await res.json();
          authStatus.textContent = "❌ " + (err.detail || "Signup failed");
        }
      } catch (e) {
        authStatus.textContent = "❌ Could not reach the server. Is it running?";
      }
    }
  </script>
</body>
</html>
