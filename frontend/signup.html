<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - AI Resume Reviewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-split">

    <!-- ===== Left: branded panel ===== -->
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <div class="auth-logo">📄 AI Resume Reviewer</div>
        <h2 class="auth-tagline">Get your resume scored in seconds</h2>
        <p class="auth-sub">Instant, actionable feedback to help you land more interviews.</p>
        <ul class="auth-features">
          <li>0–100 ATS-style score</li>
          <li>Section-by-section tips</li>
          <li>Private &amp; secure</li>
        </ul>
      </div>
    </aside>

    <!-- ===== Right: signup form ===== -->
    <main class="auth-form-side">
      <div class="auth-form-box">
        <h3 class="auth-form-title">Create your account</h3>
        <p class="auth-form-subtitle">Start scoring your resume — it's free</p>

        <label for="email" class="field-label">Email</label>
        <div class="input-icon-wrap">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </span>
          <input type="email" id="email" placeholder="example@gmail.com" />
        </div>
        <div class="error" id="emailError"></div>

        <label for="password" class="field-label">Password</label>
        <div class="input-icon-wrap">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
          <input type="password" id="password" placeholder="At least 6 characters" />
          <span id="togglePass" onclick="togglePassword()" class="input-toggle"></span>
        </div>
        <div class="error" id="passError"></div>

        <button id="signupBtn" onclick="signup()" class="btn-block" disabled>Sign up</button>
        <div id="authStatus" class="auth-status"></div>

        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </main>

  </div>

  <script>
    const API = "https://ai-resume-reviewer-qisc.onrender.com";

    // --- Grab elements ONCE. INPUTS and ERROR DIVS are different elements! ---
    const emailInput = document.getElementById("email");      // the email INPUT box
    const passInput  = document.getElementById("password");   // the password INPUT box
    const emailError = document.getElementById("emailError"); // the error message DIV
    const passError  = document.getElementById("passError");  // the error message DIV
    const signupBtn  = document.getElementById("signupBtn");
    const togglePass = document.getElementById("togglePass");
    const authStatus = document.getElementById("authStatus");

    // --- Eye icons ---
    const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const eyeOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    togglePass.innerHTML = eyeIcon;

    function togglePassword() {
      if (passInput.type === "password") {
        passInput.type = "text";
        togglePass.innerHTML = eyeOffIcon;
      } else {
        passInput.type = "password";
        togglePass.innerHTML = eyeIcon;
      }
    }

    // --- Enable button only when BOTH fields are valid ---
    function validate() {
      const email = emailInput.value.trim();
      const password = passInput.value;
      let emailOk = false, passOk = false;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        emailError.textContent = "";
      } else if (!emailPattern.test(email)) {
        emailError.textContent = "Enter a valid email address";
      } else {
        emailError.textContent = "";
        emailOk = true;
      }

      if (password === "") {
        passError.textContent = "";
      } else if (password.length < 6) {
        passError.textContent = "Password must be at least 6 characters";
      } else {
        passError.textContent = "";
        passOk = true;
      }

      signupBtn.disabled = !(emailOk && passOk);
    }

    emailInput.addEventListener("input", validate);
    passInput.addEventListener("input", validate);

    // --- Sign up ---
    async function signup() {
      const email = emailInput.value.trim();
      const password = passInput.value;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        authStatus.textContent = "❌ Please enter a valid email address.";
        return;
      }

      // --- loading state ---
      const originalText = signupBtn.innerHTML;
      signupBtn.disabled = true;
      signupBtn.innerHTML = '<span class="btn-spinner"></span> Creating account...';

      try {
        const res = await fetch(`${API}/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (res.ok) {
          authStatus.textContent = "✅ Account created! Redirecting to login...";
          // keep button disabled while we redirect
          setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } else {
          const err = await res.json();
          authStatus.textContent = "❌ " + (err.detail || "Signup failed");
          signupBtn.disabled = false;
          signupBtn.innerHTML = originalText;
        }
      } catch (e) {
        authStatus.textContent = "❌ Could not reach the server. Is it running?";
        signupBtn.disabled = false;
        signupBtn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
